name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff==0.17.3
      - run: ruff check src tests
      # Offline rebuild from the committed raw data: panel -> tests -> estimates -> figures -> tables -> paper assets
      - run: make all PY=python
      # Every number quoted in the paper and the note must be reproduced exactly.
      - run: git diff --exit-code -- paper/numbers.tex paper/tables output/tables/*.md
